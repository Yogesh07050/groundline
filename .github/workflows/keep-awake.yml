# Pings the Render instance so the free tier doesn't spin down between visits.
# Does nothing until the repository variable RENDER_URL is set to the service URL
# (GitHub: Settings > Secrets and variables > Actions > Variables).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Repository variable RENDER_URL is not set. Nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 \
            -o /dev/null -w "status %{http_code} in %{time_total}s\n" "${RENDER_URL%/}/health"
